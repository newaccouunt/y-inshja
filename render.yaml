services:
  - type: web
    name: yt-dlp-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 10000

  - type: pserv
    name: bgutil-provider
    runtime: docker
    image:
      url: docker.io/brainicism/bgutil-ytdlp-pot-provider:latest
